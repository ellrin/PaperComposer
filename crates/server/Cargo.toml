[package]
name = "pc-server"
version.workspace = true
edition.workspace = true

# Local development server: serves the UI and the core API on 127.0.0.1.
# Later the same handlers move behind Tauri commands.

[dependencies]
pc-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }
dirs = "6"
