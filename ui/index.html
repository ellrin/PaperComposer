<!doctype html>
<html lang="zh-Hant" data-theme="orange" data-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaperComposer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">PAPER<b>/</b>COMPOSER</div>
    <nav class="sections" id="sections" aria-label="章節"></nav>
    <div class="top-right" id="profileChips"></div>
  </header>

  <aside class="left" aria-label="段落大綱">
    <h2 class="panel-title"><span class="step" id="sectionStep"></span><span id="sectionName"></span></h2>
    <ol class="outline" id="outline"></ol>
    <button class="primary" id="generate" disabled>生成段落</button>
  </aside>

  <main class="page-area">
    <article class="paper" id="paper"></article>
    <div class="statusbar" id="statusbar"></div>
  </main>

  <aside class="right" aria-label="寫作助手">
    <section class="block" data-open="true" id="blockPhrases">
      <div class="block-head">
        <span class="n">01</span><h3>句型</h3>
        <button class="help" data-tip="依目前章節列出你句型庫裡的寫法。輸入重點字詞可排序；點一下複製句型。">?</button>
        <button class="toggle" aria-label="展開或收合">−</button>
      </div>
      <div class="block-body">
        <div class="field"><input type="search" id="q" placeholder="重點字詞"></div>
        <div class="row">
          <select id="fn" aria-label="功能"><option value="">全部功能</option></select>
          <select id="pos" aria-label="位置">
            <option value="">全部位置</option>
            <option value="opening">開頭</option>
            <option value="body">中段</option>
            <option value="closing">結尾</option>
            <option value="transition">轉折</option>
          </select>
        </div>
        <ul class="hits" id="hits"></ul>
      </div>
    </section>

    <section class="block" data-open="true" id="blockCheck">
      <div class="block-head">
        <span class="n">02</span><h3>檢查</h3>
        <button class="help" data-tip="目前段落觸發的規則。灰色是需要模型的軟規則，連接引擎後才會判讀。">?</button>
        <button class="toggle" aria-label="展開或收合">−</button>
      </div>
      <div class="block-body"><ul class="findings" id="findings"></ul></div>
    </section>

    <section class="block" data-open="false" id="blockTheme">
      <div class="block-head">
        <span class="n">03</span><h3>介面主題</h3>
        <button class="toggle" aria-label="展開或收合">+</button>
      </div>
      <div class="block-body">
        <div class="themes" id="themes">
          <button class="theme" data-theme="orange"><span class="swatch"><i style="background:#27272a"></i><i style="background:#ff6b35"></i><i style="background:#f0f0f1"></i></span>深灰橘</button>
          <button class="theme" data-theme="night"><span class="swatch"><i style="background:#0c0b24"></i><i style="background:#5b3df5"></i><i style="background:#f3e600"></i></span>藍紫黃</button>
          <button class="theme" data-theme="terminal"><span class="swatch"><i style="background:#080d0a"></i><i style="background:#11965a"></i><i style="background:#2ef08a"></i></span>綠黑</button>
        </div>
        <div class="themes" style="margin-top:8px">
          <button class="theme" id="dimPaper" aria-pressed="false">調暗紙張</button>
          <button class="mode" id="mode" aria-label="切換白天或黑夜"></button>
        </div>
      </div>
    </section>
  </aside>
</div>
<script src="app.js"></script>
</body>
</html>
