[package]
name = "paper-composer"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webbrowser = "0.8"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
